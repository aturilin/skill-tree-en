<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Tree — Claude Code for Business</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #F5F0E8;
    font-family: 'Source Serif 4', Georgia, serif;
    color: #2A2A2A;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 40px;
  }

  .legend {
    display: flex;
    gap: 24px;
    margin-bottom: 32px;
    font-size: 13px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }

  svg {
    max-width: 100%;
  }

  .node {
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .node:hover {
    transform: scale(1.05);
  }

  .node-rect {
    rx: 8;
    ry: 8;
    stroke-width: 2;
    transition: all 0.3s ease;
  }

  .node-label {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 11px;
    font-weight: 600;
    fill: white;
    pointer-events: none;
  }

  .node-module {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 9px;
    fill: #999;
    pointer-events: none;
  }

  .node-icon {
    font-size: 18px;
    fill: white;
    pointer-events: none;
    opacity: 0.9;
  }

  .edge {
    fill: none;
    stroke-width: 2;
    opacity: 0.4;
  }

  .edge-cross {
    stroke-dasharray: 6 4;
    stroke-width: 1.5;
    opacity: 0.25;
  }

  .tooltip {
    position: fixed;
    background: #2A2A2A;
    color: #F5F0E8;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    max-width: 260px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 100;
    line-height: 1.5;
  }

  .tooltip.visible { opacity: 1; }

  .tooltip-title {
    font-weight: 700;
    margin-bottom: 4px;
  }

  .tooltip-module {
    font-size: 11px;
    opacity: 0.7;
    margin-top: 6px;
  }

  .node.completed .node-rect { opacity: 1; }
  .node.locked .node-rect { opacity: 0.2; }
  .node.locked .node-label { opacity: 0.3; }
  .node.locked .node-icon { opacity: 0.15; }

  .controls {
    margin-top: 24px;
    display: flex;
    gap: 12px;
  }

  button {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 13px;
    padding: 8px 16px;
    border: 2px solid #2A2A2A;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  button:hover {
    background: #2A2A2A;
    color: #F5F0E8;
  }

  button.active {
    background: #2A2A2A;
    color: #F5F0E8;
  }
</style>
</head>
<body>

<h1>Skill Tree</h1>
<p class="subtitle">Claude Code for Business — 6 modules</p>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#2B5B84"></div> Technology</div>
  <div class="legend-item"><div class="legend-dot" style="background:#C4862B"></div> Skills</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3D7A5F"></div> Application</div>
</div>

<svg viewBox="0 0 900 720" width="900" height="720">
  <!-- Edges (within branch) -->
  <!-- Tech branch -->
  <path class="edge" stroke="#2B5B84" d="M450,620 L250,530" />
  <path class="edge" stroke="#2B5B84" d="M250,530 L150,430" />

  <!-- Skills branch -->
  <path class="edge" stroke="#C4862B" d="M450,620 L450,530" />
  <path class="edge" stroke="#C4862B" d="M450,530 L400,430" />
  <path class="edge" stroke="#C4862B" d="M400,430 L350,330" />

  <!-- Application branch -->
  <path class="edge" stroke="#3D7A5F" d="M450,530 L650,430" />
  <path class="edge" stroke="#3D7A5F" d="M650,430 L600,330" />
  <path class="edge" stroke="#3D7A5F" d="M600,330 L500,230" />
  <path class="edge" stroke="#3D7A5F" d="M600,330 L700,230" />

  <!-- Cross-branch edges -->
  <path class="edge edge-cross" stroke="#888" d="M250,530 C250,480 400,480 400,430" />
  <path class="edge edge-cross" stroke="#888" d="M250,530 C300,470 550,470 600,330" />
  <path class="edge edge-cross" stroke="#888" d="M150,430 L200,330" />
  <path class="edge edge-cross" stroke="#888" d="M350,330 L300,230" />
  <path class="edge edge-cross" stroke="#888" d="M350,330 C350,280 650,280 650,130" />
  <path class="edge edge-cross" stroke="#888" d="M650,430 C700,380 800,380 780,330" />
  <path class="edge edge-cross" stroke="#888" d="M700,230 L650,130" />
  <path class="edge edge-cross" stroke="#888" d="M500,230 L450,130" />

  <!-- Top convergence -->
  <path class="edge" stroke="#3D7A5F" d="M450,130 L450,60" />
  <path class="edge" stroke="#3D7A5F" d="M650,130 L450,60" />

  <!-- NODES -->

  <!-- Row 1 (bottom): Setup Claude Code — start -->
  <g class="node completed" data-id="1" data-title="Claude Code Setup" data-desc="Install Claude Code and run your first session" data-module="M1">
    <rect class="node-rect" x="385" y="600" width="130" height="44" fill="#2B5B84" />
    <text class="node-icon" x="400" y="628">⬡</text>
    <text class="node-label" x="420" y="626">Claude Code</text>
    <text class="node-module" x="450" y="654">M1</text>
  </g>

  <!-- Row 2: Prompt, API/MCP -->
  <g class="node" data-id="4" data-title="Prompting" data-desc="Formulate a task for the agent and get results" data-module="M1">
    <rect class="node-rect" x="395" y="510" width="110" height="44" fill="#C4862B" />
    <text class="node-icon" x="410" y="538">💬</text>
    <text class="node-label" x="432" y="536">Prompting</text>
    <text class="node-module" x="450" y="564">M1</text>
  </g>

  <g class="node" data-id="2" data-title="API / MCP" data-desc="Connect the agent to external services via API and MCP protocol" data-module="M3">
    <rect class="node-rect" x="190" y="510" width="120" height="44" fill="#2B5B84" />
    <text class="node-icon" x="205" y="538">⚡</text>
    <text class="node-label" x="227" y="536">API / MCP</text>
    <text class="node-module" x="250" y="564">M3</text>
  </g>

  <!-- Row 3: Writing code, Basic skill, Working with files, Email/calendar -->
  <g class="node" data-id="3" data-title="Writing Code" data-desc="Agent writes working HTML, CSS, JS from your description" data-module="M4">
    <rect class="node-rect" x="80" y="410" width="140" height="44" fill="#2B5B84" />
    <text class="node-icon" x="97" y="438">{}</text>
    <text class="node-label" x="117" y="436">Writing Code</text>
    <text class="node-module" x="150" y="464">M4</text>
  </g>

  <g class="node" data-id="5" data-title="Basic Skill" data-desc="Wrap a prompt into a reusable command" data-module="M2">
    <rect class="node-rect" x="335" y="410" width="130" height="44" fill="#C4862B" />
    <text class="node-icon" x="350" y="438">⚙</text>
    <text class="node-label" x="372" y="436">Basic Skill</text>
    <text class="node-module" x="400" y="464">M2</text>
  </g>

  <g class="node" data-id="7" data-title="Working with Files" data-desc="Agent finds, reads, and processes files on disk" data-module="M1">
    <rect class="node-rect" x="580" y="410" width="140" height="44" fill="#3D7A5F" />
    <text class="node-icon" x="597" y="438">📁</text>
    <text class="node-label" x="617" y="436">File Operations</text>
    <text class="node-module" x="650" y="464">M1</text>
  </g>

  <g class="node" data-id="10" data-title="Email / Calendar" data-desc="Agent reads Gmail and Calendar, compiles a summary" data-module="M3">
    <rect class="node-rect" x="730" y="310" width="110" height="44" fill="#3D7A5F" />
    <text class="node-icon" x="745" y="338">✉</text>
    <text class="node-label" x="763" y="336">Email / Cal</text>
    <text class="node-module" x="785" y="364">M3</text>
  </g>

  <!-- Row 4: Advanced skill, Summarization, Landing page, Spreadsheets -->
  <g class="node" data-id="6" data-title="Advanced Skill" data-desc="Skill with logic, templates, and integrations" data-module="M5">
    <rect class="node-rect" x="280" y="310" width="140" height="44" fill="#C4862B" />
    <text class="node-icon" x="295" y="338">⚙⚙</text>
    <text class="node-label" x="320" y="336">Advanced Skill</text>
    <text class="node-module" x="350" y="364">M5</text>
  </g>

  <g class="node" data-id="8" data-title="Summarization" data-desc="Agent extracts key points from large volumes of information" data-module="M1, M2">
    <rect class="node-rect" x="530" y="310" width="140" height="44" fill="#3D7A5F" />
    <text class="node-icon" x="547" y="338">Σ</text>
    <text class="node-label" x="567" y="336">Summarization</text>
    <text class="node-module" x="600" y="364">M1, M2</text>
  </g>

  <g class="node" data-id="11" data-title="Landing Page" data-desc="From a text brief to a working HTML page" data-module="M4">
    <rect class="node-rect" x="120" y="310" width="140" height="44" fill="#3D7A5F" />
    <text class="node-icon" x="137" y="338">🌐</text>
    <text class="node-label" x="157" y="336">Landing Page</text>
    <text class="node-module" x="190" y="364">M4</text>
  </g>

  <g class="node" data-id="12" data-title="Spreadsheets" data-desc="Agent reads and analyzes CSV, Excel files" data-module="M6">
    <rect class="node-rect" x="630" y="210" width="140" height="44" fill="#3D7A5F" />
    <text class="node-icon" x="647" y="238">▦</text>
    <text class="node-label" x="667" y="236">Spreadsheets</text>
    <text class="node-module" x="700" y="264">M6</text>
  </g>

  <!-- Row 5: Presentations, Document analysis, Data analysis -->
  <g class="node" data-id="9" data-title="Presentations" data-desc="Agent generates slides from data and text" data-module="M1, M6">
    <rect class="node-rect" x="430" y="210" width="150" height="44" fill="#3D7A5F" />
    <text class="node-icon" x="447" y="238">📊</text>
    <text class="node-label" x="467" y="236">Presentations</text>
    <text class="node-module" x="505" y="264">M1, M6</text>
  </g>

  <g class="node" data-id="14" data-title="Document Analysis" data-desc="Agent cross-references multiple documents and highlights key points" data-module="M5">
    <rect class="node-rect" x="220" y="210" width="160" height="44" fill="#3D7A5F" />
    <text class="node-icon" x="237" y="238">🔍</text>
    <text class="node-label" x="257" y="236">Document Analysis</text>
    <text class="node-module" x="300" y="264">M5</text>
  </g>

  <g class="node" data-id="13" data-title="Data Analysis" data-desc="Agent calculates metrics, builds P&amp;L, finds patterns" data-module="M6">
    <rect class="node-rect" x="580" y="110" width="140" height="44" fill="#3D7A5F" />
    <text class="node-icon" x="597" y="138">📈</text>
    <text class="node-label" x="617" y="136">Data Analysis</text>
    <text class="node-module" x="650" y="164">M6</text>
  </g>

  <!-- Row 6 (top): Structured file creation -->
  <g class="node" data-id="15" data-title="Structured Documents" data-desc="Agent creates a document from a template: report, position paper, brief" data-module="M5, M6">
    <rect class="node-rect" x="350" y="110" width="180" height="44" fill="#3D7A5F" />
    <text class="node-icon" x="367" y="138">📄</text>
    <text class="node-label" x="387" y="136">Structured Docs</text>
    <text class="node-module" x="440" y="164">M5, M6</text>
  </g>

</svg>

<div class="controls">
  <button onclick="showModule(0)">All</button>
  <button onclick="showModule(1)">M1</button>
  <button onclick="showModule(2)">M2</button>
  <button onclick="showModule(3)">M3</button>
  <button onclick="showModule(4)">M4</button>
  <button onclick="showModule(5)">M5</button>
  <button onclick="showModule(6)">M6</button>
</div>

<div class="tooltip" id="tooltip">
  <div class="tooltip-title"></div>
  <div class="tooltip-desc"></div>
  <div class="tooltip-module"></div>
</div>

<script>
const moduleMap = {
  1: [1],         // Setup
  2: [2],         // API/MCP
  3: [3],         // Code
  4: [1],         // Prompt
  5: [2],         // Basic skill
  6: [5],         // Advanced skill
  7: [1],         // Files
  8: [1, 2],      // Summarization
  9: [1, 6],      // Presentations
  10: [3],        // Email/cal
  11: [4],        // Landing page
  12: [6],        // Spreadsheets
  13: [6],        // Data analysis
  14: [5],        // Document analysis
  15: [5, 6]      // Structured docs
};

const tooltip = document.getElementById('tooltip');
const nodes = document.querySelectorAll('.node');

nodes.forEach(node => {
  node.addEventListener('mouseenter', e => {
    const title = node.dataset.title;
    const desc = node.dataset.desc;
    const module = node.dataset.module;
    tooltip.querySelector('.tooltip-title').textContent = title;
    tooltip.querySelector('.tooltip-desc').textContent = desc;
    tooltip.querySelector('.tooltip-module').textContent = module;
    tooltip.classList.add('visible');
  });

  node.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
  });

  node.addEventListener('mouseleave', () => {
    tooltip.classList.remove('visible');
  });
});

function showModule(m) {
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  nodes.forEach(node => {
    const id = parseInt(node.dataset.id);
    const modules = moduleMap[id];

    if (m === 0) {
      node.classList.remove('locked');
      node.classList.add('completed');
    } else if (modules.includes(m)) {
      node.classList.remove('locked');
      node.classList.add('completed');
    } else {
      node.classList.add('locked');
      node.classList.remove('completed');
    }
  });
}
</script>
</body>
</html>
